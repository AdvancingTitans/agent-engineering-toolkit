name: Bug report
description: Report a reproducible AET behavior or evidence-boundary problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets, private paths, and unredacted command output.
  - type: input
    id: version
    attributes:
      label: AET version
      placeholder: "aet --version"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: AET surface
      options:
        - Quick check
        - Quick scope
        - Quick proof
        - Quick fresh
        - Demo
        - Portable Evidence Bundle
        - Evidence Atlas
        - Improvement
        - Plan
        - Packaging or installation
        - Documentation
        - Repository Evolution
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact command and safe reproduction
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual evidence state
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Python, Git, and host Agent versions
    validations:
      required: true
