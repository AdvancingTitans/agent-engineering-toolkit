<text x="489" y="233" font-size="14" fill="#94a3b8">source nodes · grounded edges ·</text>
<text x="489" y="253" font-size="14" fill="#94a3b8">authority · Freshness</text>
</g>
<g filter="url(#shadow)"><rect x="860" y="165" width="310" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#b99aff" stroke-opacity=".42"/>
<rect x="860" y="165" width="5" height="118" rx="2.5" fill="#b99aff"/>
<text x="884" y="203" font-size="20" font-weight="700" fill="#edf4ff">Ten fixed Perspectives</text>
<text x="884" y="233" font-size="14" fill="#94a3b8">eight evidence views + Improvement</text>
<text x="884" y="253" font-size="14" fill="#94a3b8">Chain + Regression Lineage</text>
</g>
<g filter="url(#shadow)"><rect x="1255" y="165" width="280" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#f3b95f" stroke-opacity=".42"/>
<rect x="1255" y="165" width="5" height="118" rx="2.5" fill="#f3b95f"/>
<text x="1279" y="203" font-size="20" font-weight="700" fill="#edf4ff">Recursive decomposition</text>
<text x="1279" y="233" font-size="14" fill="#94a3b8">complex nodes get subgraphs;</text>
<text x="1279" y="253" font-size="14" fill="#94a3b8">leaves stay compact</text>
</g>
<g filter="url(#shadow)"><rect x="1255" y="390" width="280" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#45d7e8" stroke-opacity=".42"/>
