<text x="884" y="458" font-size="14" fill="#94a3b8">three columns · path highlighting ·</text>
<text x="884" y="478" font-size="14" fill="#94a3b8">filters · raw refs</text>
</g>
<g filter="url(#shadow)"><rect x="465" y="390" width="310" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#ef7078" stroke-opacity=".42"/>
<rect x="465" y="390" width="5" height="118" rx="2.5" fill="#ef7078"/>
<text x="489" y="428" font-size="20" font-weight="700" fill="#edf4ff">Fail-closed Validator</text>
<text x="489" y="458" font-size="14" fill="#94a3b8">counter-evidence retained · stale not</text>
<text x="489" y="478" font-size="14" fill="#94a3b8">upgraded · UNKNOWN visible</text>
</g>
<g filter="url(#shadow)"><rect x="70" y="390" width="310" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#f3b95f" stroke-opacity=".42"/>
<rect x="70" y="390" width="5" height="118" rx="2.5" fill="#f3b95f"/>
