<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<text x="60" y="65" font-size="36" font-weight="800" fill="#edf4ff">AET v1.16 Evidence Atlas Architecture</text>
<text x="60" y="98" font-size="16" fill="#94a3b8">One portable evidence source drives a recursive map and bounded code-improvement prompts</text>
<text x="1540" y="66" text-anchor="end" class="mono" font-size="13" fill="#71db9b">DETERMINISTIC · OFFLINE · STRICT</text>
