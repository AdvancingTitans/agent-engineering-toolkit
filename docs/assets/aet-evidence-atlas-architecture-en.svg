<rect x="70" y="165" width="5" height="118" rx="2.5" fill="#45d7e8"/>
<text x="94" y="203" font-size="20" font-weight="700" fill="#edf4ff">Portable Evidence Bundle</text>
<text x="94" y="233" font-size="14" fill="#94a3b8">Claims · Evidence · Observations ·</text>
<text x="94" y="253" font-size="14" fill="#94a3b8">Conflicts</text>
</g>
<g filter="url(#shadow)"><rect x="465" y="165" width="310" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#71db9b" stroke-opacity=".42"/>
