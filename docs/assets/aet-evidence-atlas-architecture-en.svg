<text x="1279" y="458" font-size="14" fill="#94a3b8">Diagram IR · Mermaid · Markdown ·</text>
<text x="1279" y="478" font-size="14" fill="#94a3b8">JSON</text>
</g>
<g filter="url(#shadow)"><rect x="860" y="390" width="310" height="118" rx="18" fill="#101722" fill-opacity=".94" stroke="#71db9b" stroke-opacity=".42"/>
