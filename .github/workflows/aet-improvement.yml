name: AET Improvement Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  improvement-summary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AET
        run: python -m pip install .

      - name: Generate deterministic Improvement Summary
        id: improve
        continue-on-error: true
        env:
          AET_IMPROVEMENT_BUNDLE: .aet/evidence/bundle
        run: |
          if [ -d "$AET_IMPROVEMENT_BUNDLE" ]; then
            aet improve "$AET_IMPROVEMENT_BUNDLE"
          else
            mkdir -p .aet/improvements
            {
              echo "# Human Improvement Report"
              echo
              echo "No Portable Evidence Bundle was supplied; improvement state is UNKNOWN."
            } > .aet/improvements/human-report.md
          fi

      - name: Publish non-authoritative PR summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- aet-improvement-summary -->";
            const report = fs.readFileSync(
              ".aet/improvements/human-report.md",
              "utf8"
            );
            const body = [
              marker,
              "## Improvement Summary",
              "",
              "> Deterministic, non-authoritative guidance. This comment does not block merge.",
              "",
              report,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
