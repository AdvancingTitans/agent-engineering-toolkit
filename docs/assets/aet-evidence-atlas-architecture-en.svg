<text x="105" y="655" font-size="18" font-weight="700" fill="#f3b95f">AUTHORITY BOUNDARY</text>
<text x="105" y="700" font-size="24" font-weight="700" fill="#edf4ff">Bundle → Graph / Atlas; Bundle → Issue / Constraint / Prompt</text>
<text x="105" y="746" font-size="17" fill="#94a3b8">Both derivations share Evidence IDs, but prompts never write back as evidence; fix, merge, push, and release remain human decisions.</text>
</svg>